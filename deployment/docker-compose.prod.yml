version: "3.9"

# ============================================================
# ForesightAI — Production Docker Compose
# Usage: docker-compose -f deployment/docker-compose.prod.yml up -d
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: foresightai_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foresightai}
      POSTGRES_USER: ${POSTGRES_USER:-foresight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foresight}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      target: production
    container_name: foresightai_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foresight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-foresightai}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:///mlflow.db}
      ML_RANDOM_SEED: 42
      ML_MODEL_VERSION: ${ML_MODEL_VERSION:-1.0.0}
      ML_LOG_LEVEL: INFO
    volumes:
      - model_artifacts:/app/models/artifacts
      - mlflow_data:/app/mlflow
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------------------------
  # React Frontend (served as static build)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      target: production
    container_name: foresightai_frontend_prod
    restart: always
    networks:
      - frontend_net
    expose:
      - "3000"

  # ----------------------------------------------------------
  # NGINX Reverse Proxy
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: foresightai_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_files:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # Prometheus Monitoring
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: foresightai_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - backend_net
    expose:
      - "9090"

  # ----------------------------------------------------------
  # Grafana Dashboards
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.1.0
    container_name: foresightai_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_SERVER_ROOT_URL: https://your-domain.com/grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_dashboard.json:/etc/grafana/provisioning/dashboards/foresightai.json:ro
    depends_on:
      - prometheus
    networks:
      - backend_net
    expose:
      - "3001"

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  model_artifacts:
    driver: local
  mlflow_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  static_files:
    driver: local

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: false
