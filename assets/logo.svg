<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(10, 10)">
    <!-- Eye Shape representing "Foresight" -->
    <path d="M40 15 C 10 15, 0 40, 0 40 C 0 40, 10 65, 40 65 C 70 65, 80 40, 80 40 C 80 40, 70 15, 40 15 Z" 
          fill="none" stroke="url(#blueGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Iris -->
    <circle cx="40" cy="40" r="16" fill="url(#greenGradient)" />
    
    <!-- AI Data Nodes -->
    <circle cx="40" cy="40" r="4" fill="#ffffff" />
    <circle cx="60" cy="40" r="4" fill="#3b82f6" />
    <circle cx="20" cy="40" r="4" fill="#3b82f6" />
    <line x1="20" y1="40" x2="60" y2="40" stroke="#3b82f6" stroke-width="2" />
  </g>

  <!-- Logo Text -->
  <g transform="translate(110, 60)">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#1e293b">Foresight</text>
    <text x="215" y="0" font-family="'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="900" fill="url(#blueGradient)">AI</text>
  </g>
</svg>
