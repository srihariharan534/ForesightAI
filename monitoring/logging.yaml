version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)-8s] %(name)s — %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(message)s %(pathname)s %(lineno)d"
  simple:
    format: "%(levelname)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  rotating_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/foresightai.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: json
    filename: logs/errors.log
    maxBytes: 5242880    # 5 MB
    backupCount: 3
    encoding: utf8

  ml_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/ml_engine.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

loggers:
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false

  uvicorn.error:
    level: ERROR
    handlers: [console, error_file]
    propagate: false

  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: false

  fastapi:
    level: INFO
    handlers: [console, rotating_file]
    propagate: false

  app:
    level: INFO
    handlers: [console, rotating_file, error_file]
    propagate: false

  ml_engine:
    level: DEBUG
    handlers: [console, ml_file]
    propagate: false

  simulation:
    level: INFO
    handlers: [console, ml_file]
    propagate: false

  monitoring:
    level: INFO
    handlers: [console, rotating_file]
    propagate: false

  sqlalchemy.engine:
    level: WARNING
    handlers: [rotating_file]
    propagate: false

  mlflow:
    level: WARNING
    handlers: [rotating_file]
    propagate: false

root:
  level: WARNING
  handlers: [console, rotating_file]
