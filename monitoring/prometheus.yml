global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: foresightai
    environment: production

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: foresightai_backend
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [backend:8000]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: foresightai-backend

  - job_name: node_exporter
    scrape_interval: 30s
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: postgres_exporter
    scrape_interval: 30s
    static_configs:
      - targets: [postgres-exporter:9187]
